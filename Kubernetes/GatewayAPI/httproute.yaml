apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: myapp-route
  namespace: ivolve
spec:
  parentRefs:
    - name: ivolve-gateway
  hostnames:
    - "ivolve.example.com"
    - "myapp.ivolve.local"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: myapp-service
          port: 3000
        - name: ivolveappsvc
          port: 3000

