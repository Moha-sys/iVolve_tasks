---
docker_repo_url: "https://download.docker.com/linux/rhel/docker-ce.repo"
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
docker_service_state: started
docker_service_enabled: true
docker_users:
  - "{{ ansible_user | default('moha') }}"
