---
# ==============================================================================
# Lab 28: Automated Configuration of EC2 Discovered via Dynamic Inventory
# Targets: tag_server_ivolve
# ==============================================================================
- name: Configure Web Server on Dynamically Discovered AWS EC2
  hosts: tag_server_ivolve
  become: true
  vars:
    web_package: "{{ 'nginx' if ansible_os_family == 'RedHat' else 'apache2' }}"
    web_service: "{{ 'nginx' if ansible_os_family == 'RedHat' else 'apache2' }}"
    web_doc_root: "/usr/share/nginx/html"

  tasks:
    # --------------------------------------------------------------------------
    # 1. Host Discovery Verification
    # --------------------------------------------------------------------------
    - name: Display dynamically discovered EC2 metadata
      ansible.builtin.debug:
        msg:
          - "=== Host Discovered via AWS Dynamic Inventory ==="
          - "Hostname      : {{ inventory_hostname }}"
          - "Ansible Host  : {{ ansible_host | default('N/A') }}"
          - "Architecture  : {{ ansible_architecture }}"
          - "OS Family     : {{ ansible_os_family }}"
          - "EC2 Tags      : {{ ec2_tags | default({}) }}"

    # --------------------------------------------------------------------------
    # 2. Package Installation & Service Configuration
    # --------------------------------------------------------------------------
    - name: Ensure web server package is installed
      ansible.builtin.package:
        name: "{{ web_package }}"
        state: present

    - name: Create custom landing page indicating dynamic automation
      ansible.builtin.copy:
        content: |
          <!DOCTYPE html>
          <html>
          <head>
            <title>iVolve Dynamic Inventory EC2</title>
            <style>
              body { font-family: sans-serif; background-color: #0f172a; color: #f8fafc; padding: 50px; text-align: center; }
              .card { background-color: #1e293b; border-radius: 12px; padding: 30px; display: inline-block; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
              h1 { color: #38bdf8; }
              .badge { background: #10b981; color: #022c22; padding: 6px 12px; border-radius: 9999px; font-weight: bold; }
            </style>
          </head>
          <body>
            <div class="card">
              <h1>iVolve Cloud Automation with Ansible</h1>
              <p><span class="badge">Dynamic Inventory Active</span></p>
              <p>Discovered via Tag: <strong>server:ivolve</strong></p>
              <p>Host: <code>{{ inventory_hostname }}</code> ({{ ansible_default_ipv4.address | default(ansible_host) }})</p>
            </div>
          </body>
          </html>
        dest: "{{ web_doc_root }}/index.html"
        mode: '0644'

    - name: Ensure web service is started and enabled
      ansible.builtin.service:
        name: "{{ web_service }}"
        state: started
        enabled: true

    # --------------------------------------------------------------------------
    # 3. In-Playbook Verification
    # --------------------------------------------------------------------------
    - name: Validate HTTP response on localhost
      ansible.builtin.uri:
        url: http://127.0.0.1/
        return_content: true
        status_code: 200
      register: http_response
      ignore_errors: true

    - name: Confirm web service health
      ansible.builtin.debug:
        msg: "Web service responding with HTTP {{ http_response.status | default('OK') }} on {{ inventory_hostname }}"
